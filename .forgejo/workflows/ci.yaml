name: CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint licensing
        run: nix develop -c reuse lint

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev

  test:
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nix fetches the Zig dependencies, so they come from the Nix cache,
      # and they go where `zig build` looks for them before fetching.
      - name: Stage Zig dependencies
        run: |
          mkdir -p zig-pkg
          cp -rsL --no-preserve=mode "$(nix build --no-link --print-out-paths .#zig-deps)"/. zig-pkg/

      - name: Run tests
        run: nix develop -c zig build test

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev

  publish:
    runs-on: nixos-do-s
    enable-openid-connect: true
    needs:
      - lint
      - test
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nix fetches the Zig dependencies, so they come from the Nix cache,
      # and they go where `zig build` looks for them before fetching.
      - name: Stage Zig dependencies
        run: |
          mkdir -p zig-pkg
          cp -rsL --no-preserve=mode "$(nix build --no-link --print-out-paths .#zig-deps)"/. zig-pkg/

      - name: Build docs
        run: nix develop -c zig build docs

      - name: Publish docs
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/zig-netbox/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev
